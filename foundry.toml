[profile.default]
src = "contracts"
test = "foundry/test"
out = "foundry/out"
cache_path = "foundry/cache"
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "@openzeppelin/contracts-upgradeable/=node_modules/@openzeppelin/contracts-upgradeable/",
]

[fuzz]
runs = 1000
seed = "0x5eed"

[invariant]
runs = 256
depth = 100
fail_on_revert = true
